name: Python syntax checks

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m compileall -q main.py database ui tests

      - name: Run formatter tests
        run: python -m unittest discover -s tests -v

  ui-import-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install UI dependencies
        run: python -m pip install PySide6 pyodbc

      - name: Import UI modules
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ui_import_smoke.py
