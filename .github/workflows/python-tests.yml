name: CI - Kiểm thử hệ thống quản lý nhà sách

on:
  push:
    branches:
      - main
      - "refactor-app"
      - "refactor/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - "refactor-app"
      - "refactor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automated-tests:
    name: Compile, unit tests và UI import smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt and ODBC system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            unixodbc \
            unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q main.py database ui tests

      - name: Run automated unit and utility tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify internal import paths
        run: python -m unittest discover -s tests -p "test_import.py" -v

      - name: Import all UI packages
        run: python tests/test_giao_dien.py
